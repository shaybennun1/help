<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Welcome</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: #fff;
    }
    .card {
      text-align: center;
      padding: 3rem 4rem;
      background: rgba(255, 255, 255, 0.12);
      border-radius: 20px;
      backdrop-filter: blur(10px);
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
      max-width: 90vw;
    }
    h1 { font-size: 3rem; margin-bottom: 1rem; }
    p { font-size: 1.2rem; opacity: 0.9; margin-bottom: 2rem; }
    button {
      padding: 0.8rem 2rem;
      font-size: 1rem;
      border: none;
      border-radius: 999px;
      background: #fff;
      color: #764ba2;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.15s;
    }
    button:hover { transform: scale(1.05); }
    #time { margin-top: 1.5rem; font-size: 0.95rem; opacity: 0.8; }
  </style>
</head>
<body>
  <div class="card">
    <h1>👋 Welcome!</h1>
    <p>This page was created as a test and published from GitHub.</p>
    <button onclick="greet()">Say hello</button>
    <div id="time"></div>
  </div>
  <script>
    function greet() {
      const h = new Date().getHours();
      const msg = h < 12 ? "Good morning" : h < 18 ? "Good afternoon" : "Good evening";
      document.getElementById("time").textContent = msg + "! It's " + new Date().toLocaleTimeString() + ".";
    }
  </script>
</body>
</html>
